[project]
name = "clinical-trial-decision-lab"
version = "0.1.0"
description = "Reproducible benchmark of AI decision models vs deterministic rules and general LLMs for clinical-trial enrollment-eligibility and informed-consent issue triage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Smart Mobile House" }]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2",
    "pydantic>=2.9",
    "python-dotenv>=1",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
triallab = "triallab.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pip-licenses>=5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "triallab"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# studies/ holds byte-identical archived scripts whose SHA-256 fingerprints are frozen; never reformat them.
extend-exclude = ["studies"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: bugbear, UP: modern syntax, S: security, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # typer.Option(...) in defaults is how Typer declares options

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "E501"]  # asserts; fake secrets; non-crypto random; fixtures
"src/triallab/synthetic/**" = ["S101", "S311"]  # seeded, reproducible data generation; internal invariants

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]  # understands pydantic defaults
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not live'"
markers = ["live: calls a real paid provider API; never runs by default"]
