# Runs the same gate as `make check`. Never calls a provider: tests block the network and no secrets are used.
# Actions are pinned to full commit hashes.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the preflight and the secret scan read the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
      - name: Install pinned dependencies
        run: uv sync --frozen
      - name: Formatting and linting
        run: make lint
      - name: Types
        run: make typecheck
      - name: Unit and integration tests (mocked providers, offline)
        run: make test
      - name: Dataset reproducibility and ground-truth integrity
        run: make data
      - name: Dependency licence screen
        run: make licenses
      - name: Publication preflight (restricted files, notices, sensitive data, artifacts)
        run: make preflight
      - name: Documentation links
        run: uv run python scripts/check_doc_links.py
      - name: Secret scan
        # The gitleaks binary, pinned by version and checksum. The gitleaks GitHub Action needs a licence key
        # for organisation repositories; the binary does not.
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --log-opts=--all .
